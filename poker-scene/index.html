<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Peek</title>
<style>
/*
VOICE: hushed, late-night high stakes room
IDEA: your seat at the table, seen through your own eyes
PICTURE: full-bleed Three.js scene, cards in your hand at the bottom
COLOUR and TYPE: felt green, warm tungsten, black; Inter for the one hint
LAYOUT: canvas fills the screen, a single quiet hint pill
*/
html,body{margin:0;height:100%;background:#060504;overflow:hidden}
canvas{display:block;touch-action:none;outline:none}
#vig{pointer-events:none;position:fixed;inset:0;
  background:
    linear-gradient(to bottom,rgba(4,3,2,.92) 0%,rgba(4,3,2,.35) 14%,transparent 30%),
    radial-gradient(ellipse 85% 75% at 50% 62%,transparent 50%,rgba(0,0,0,.7) 100%)}
#hint{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);
  font:500 15px/1.3 Inter,system-ui,-apple-system,sans-serif;color:#efe4cc;white-space:nowrap;
  background:rgba(12,9,7,.62);padding:11px 18px;border-radius:999px;border:1px solid rgba(239,228,204,.16);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:none;transition:opacity 1.2s ease}
#hint.hide{opacity:0}
#err{display:none;position:fixed;inset:0;place-items:center;color:#efe4cc;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:24px}
@media (max-width:480px){#hint{font-size:13px;padding:9px 14px}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="vig"></div>
<div id="hint">Drag your cards up to peek, down to hide</div>
<div id="err">This scene needs WebGL, which isn't available in this browser.</div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const TAU = Math.PI * 2, rad = d => d * Math.PI / 180;
const V3 = THREE.Vector3, UPV = new V3(0, 1, 0);
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const R = (a, b) => a + rnd() * (b - a);
const TABLE_Y = 0.78;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- renderer / scene / camera ---------- */
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
canvas.tabIndex = 0;
canvas.setAttribute('aria-label', 'Poker table. Drag your two cards up to peek at them, or use the up and down arrow keys.');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060504);
scene.fog = new THREE.Fog(0x060504, 4.2, 10.5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.12;

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.05, 40);
camera.rotation.order = 'YXZ';
const CAM = new V3(0, 1.17, 1.8);
let basePitch = 0;
function fitCamera() {
  const a = innerWidth / innerHeight;
  camera.aspect = a;
  camera.fov = a < 0.8 ? 66 : a < 1.2 ? 58 : 50;
  // keep the top of the frame just above eye level so nobody's face is ever in view
  basePitch = rad(camera.fov / 2 - 1.5);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
fitCamera();
addEventListener('resize', fitCamera);

/* ---------- canvas texture helpers ---------- */
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
}
function spade(g, cx, cy, s) {
  const P = (x, y) => [cx + x * s, cy + y * s];
  g.beginPath(); g.moveTo(...P(0, -0.5));
  g.bezierCurveTo(...P(0.16, -0.27), ...P(0.5, -0.12), ...P(0.5, 0.1));
  g.bezierCurveTo(...P(0.5, 0.31), ...P(0.24, 0.38), ...P(0.05, 0.21));
  g.bezierCurveTo(...P(0.07, 0.36), ...P(0.13, 0.45), ...P(0.22, 0.5));
  g.lineTo(...P(-0.22, 0.5));
  g.bezierCurveTo(...P(-0.13, 0.45), ...P(-0.07, 0.36), ...P(-0.05, 0.21));
  g.bezierCurveTo(...P(-0.24, 0.38), ...P(-0.5, 0.31), ...P(-0.5, 0.1));
  g.bezierCurveTo(...P(-0.5, -0.12), ...P(-0.16, -0.27), ...P(0, -0.5));
  g.closePath();
}
function noise(g, w, h, amt, tint = [1, 1, 1]) {
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * amt;
    d[i] += n * tint[0]; d[i + 1] += n * tint[1]; d[i + 2] += n * tint[2];
  }
  g.putImageData(id, 0, 0);
}

/* ---------- room ---------- */
const carpet = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#1a0a0c'; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(150,110,50,.35)'; g.lineWidth = 3;
  for (const [x, y] of [[64, 64], [192, 192]]) {
    g.beginPath(); g.moveTo(x, y - 46); g.lineTo(x + 46, y); g.lineTo(x, y + 46); g.lineTo(x - 46, y); g.closePath(); g.stroke();
    g.beginPath(); g.arc(x, y, 14, 0, TAU); g.stroke();
  }
  noise(g, w, h, 18);
});
carpet.wrapS = carpet.wrapT = THREE.RepeatWrapping; carpet.repeat.set(26, 26);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ map: carpet, roughness: 1 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// distant casino glow (bokeh)
const bokehTex = canvasTex(128, 128, (g, w) => {
  const r = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.55, 'rgba(255,255,255,.55)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, w, w);
});
const bokehCols = [0xffb347, 0xff7a3d, 0xffd27a, 0xd94a4a, 0x7fb8ff, 0xffe9b8];
for (let i = 0; i < 46; i++) {
  const a = R(0, TAU), d = R(6.5, 10);
  const m = new THREE.SpriteMaterial({ map: bokehTex, color: bokehCols[i % 6], transparent: true, opacity: R(0.12, 0.32), blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
  const s = new THREE.Sprite(m); const sc = R(0.25, 0.7);
  s.scale.set(sc, sc, 1); s.position.set(Math.sin(a) * d, R(0.55, 1.6), Math.cos(a) * d - 1.5);
  s.userData = { o: m.opacity, ph: R(0, TAU), sp: R(0.3, 1.1) };
  scene.add(s); (scene.userData.bokeh ||= []).push(s);
}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x463a2e, 0x0a0706, 0.7));
const key = new THREE.SpotLight(0xffd7a3, 52, 9, 0.7, 0.75, 2);
key.position.set(0, 3.05, 0.1); key.target.position.set(0, TABLE_Y, 0.15);
key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0003; key.shadow.normalBias = 0.0015;
key.shadow.camera.near = 1; key.shadow.camera.far = 5; key.shadow.radius = 4;
scene.add(key, key.target);
const fill = new THREE.SpotLight(0xffe6c4, 1.6, 4, 0.2, 0.9, 2);
fill.position.set(-0.3, 2.3, 2.1); fill.target.position.set(0, TABLE_Y, 1.15);
scene.add(fill, fill.target);
const glow = new THREE.PointLight(0xffcf9a, 7, 6, 2); glow.position.set(0, 1.75, -0.2); scene.add(glow);
const rimL = new THREE.PointLight(0xff9a55, 3.2, 7, 2); rimL.position.set(-2.8, 1.6, -2.6); scene.add(rimL);
const rimR = new THREE.PointLight(0x9fb6ff, 2.2, 7, 2); rimR.position.set(2.9, 1.5, -2.2); scene.add(rimR);

/* ---------- table ---------- */
const FELT_R = 1.36;
const feltTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#08321d'; g.fillRect(0, 0, w, h);
  noise(g, w, h, 16, [0.5, 1, 0.65]);
  const rg = g.createRadialGradient(w / 2, h / 2, w * 0.05, w / 2, h / 2, w * 0.5);
  rg.addColorStop(0, 'rgba(40,110,70,.08)'); rg.addColorStop(0.6, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.5)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
  g.strokeStyle = 'rgba(210,192,132,.30)';
  g.lineWidth = 3; g.beginPath(); g.arc(w / 2, h / 2, w * 0.5 * 0.79, 0, TAU); g.stroke();
  g.lineWidth = 1.4; g.beginPath(); g.arc(w / 2, h / 2, w * 0.5 * 0.772, 0, TAU); g.stroke();
  const txt = "NO LIMIT · TEXAS HOLD'EM", n = txt.length, Rt = w * 0.5 * 0.52, span = 1.45;
  g.font = '600 23px Georgia, "Times New Roman", serif'; g.fillStyle = 'rgba(218,196,132,.34)';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  for (let i = 0; i < n; i++) {
    const th = Math.PI / 2 + span / 2 - span * (i + 0.5) / n;
    g.save(); g.translate(w / 2 + Math.cos(th) * Rt, h / 2 + Math.sin(th) * Rt); g.rotate(th - Math.PI / 2); g.fillText(txt[i], 0, 0); g.restore();
  }
});
const felt = new THREE.Mesh(new THREE.CircleGeometry(FELT_R, 128), new THREE.MeshStandardMaterial({ map: feltTex, roughness: 0.96, metalness: 0, envMapIntensity: 0.2 }));
felt.rotation.x = -Math.PI / 2; felt.position.y = TABLE_Y; felt.receiveShadow = true; scene.add(felt);

const woodTex = canvasTex(1024, 1024, (g, w, h) => {
  g.fillStyle = '#2a0f08'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    g.strokeStyle = `rgba(${R(60, 110) | 0},${R(22, 40) | 0},${R(10, 20) | 0},${R(0.15, 0.45)})`;
    g.lineWidth = R(1, 4); const y = R(0, h);
    g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * 0.3, y + R(-20, 20), w * 0.7, y + R(-20, 20), w, y + R(-10, 10)); g.stroke();
  }
});
const woodMat = new THREE.MeshPhysicalMaterial({ map: woodTex, roughness: 0.38, clearcoat: 1, clearcoatRoughness: 0.18 });
const track = new THREE.Mesh(new THREE.RingGeometry(FELT_R - 0.002, 1.445, 128, 1), woodMat);
track.rotation.x = -Math.PI / 2; track.position.y = TABLE_Y + 0.004; track.receiveShadow = true; scene.add(track);

const leather = new THREE.MeshPhysicalMaterial({ color: 0x0d0b0a, roughness: 0.62, clearcoat: 0.15, clearcoatRoughness: 0.55, envMapIntensity: 0.15 });
const rail = new THREE.Mesh(new THREE.TorusGeometry(1.525, 0.088, 28, 180), leather);
rail.rotation.x = -Math.PI / 2; rail.position.y = TABLE_Y + 0.02; rail.castShadow = rail.receiveShadow = true; scene.add(rail);
const apron = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.52, 0.14, 128, 1, true), woodMat);
apron.position.y = TABLE_Y - 0.08; scene.add(apron);
const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.55, TABLE_Y - 0.15, 48), new THREE.MeshStandardMaterial({ color: 0x0c0907, roughness: 0.6 }));
base.position.y = (TABLE_Y - 0.15) / 2; scene.add(base);

/* ---------- chips (instanced) ---------- */
const CHIP = { r: 0.021, t: 0.0036 };
const chipDefs = [
  { c: '#b3121f', e: '#f2efe6', d: '5' }, { c: '#151515', e: '#e9e2cf', d: '100' }, { c: '#0f6b3a', e: '#f2efe6', d: '25' },
  { c: '#1d3d9e', e: '#f2efe6', d: '50' }, { c: '#5a2a86', e: '#f0d36b', d: '500' }, { c: '#e8e3d6', e: '#1d3d9e', d: '1' },
  { c: '#cf7419', e: '#151515', d: '1K' }
];
const chipMats = chipDefs.map(cd => {
  const side = canvasTex(256, 16, (g, w, h) => {
    g.fillStyle = cd.c; g.fillRect(0, 0, w, h); g.fillStyle = cd.e;
    for (let i = 0; i < 8; i++) g.fillRect(i * w / 8 + w / 40, 0, w / 22, h);
  });
  const top = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = cd.c; g.fillRect(0, 0, w, h);
    g.save(); g.translate(w / 2, h / 2); g.fillStyle = cd.e;
    for (let i = 0; i < 8; i++) { g.save(); g.rotate(i * TAU / 8 + TAU / 32); g.fillRect(-11, -w / 2, 22, 28); g.restore(); }
    g.strokeStyle = cd.e; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, w * 0.33, 0, TAU); g.stroke();
    g.setLineDash([7, 8]); g.lineWidth = 2; g.beginPath(); g.arc(0, 0, w * 0.285, 0, TAU); g.stroke(); g.setLineDash([]);
    g.font = '700 50px Georgia, serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(cd.d, 0, 4);
    g.restore(); noise(g, w, h, 10);
  });
  const ms = new THREE.MeshStandardMaterial({ map: side, roughness: 0.5 });
  const mt = new THREE.MeshStandardMaterial({ map: top, roughness: 0.4 });
  return [ms, mt, mt];
});
const chipGeo = new THREE.CylinderGeometry(CHIP.r, CHIP.r, CHIP.t, 40);
const chipLists = chipDefs.map(() => []);
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), ONE = new V3(1, 1, 1);
function addChip(ci, x, y, z, rx = 0, rz = 0) {
  _e.set(rx, R(0, TAU), rz); _q.setFromEuler(_e);
  chipLists[ci].push(new THREE.Matrix4().compose(new V3(x, y, z), _q.clone(), ONE));
}
function addStack(x, z, n, ci, mix = 0, y0 = TABLE_Y) {
  for (let i = 0; i < n; i++) {
    const c = rnd() < mix ? (rnd() * chipDefs.length | 0) : ci;
    addChip(c, x + R(-1, 1) * 0.0011, y0 + CHIP.t * (i + 0.5) + 0.0003, z + R(-1, 1) * 0.0011);
  }
  return y0 + CHIP.t * n;
}
// the pot
{
  const spots = [[0, 0]];
  for (let k = 0; k < 6; k++) spots.push([Math.cos(k * TAU / 6) * 0.046, Math.sin(k * TAU / 6) * 0.046]);
  for (let k = 0; k < 12; k++) spots.push([Math.cos(k * TAU / 12 + 0.26) * 0.091, Math.sin(k * TAU / 12 + 0.26) * 0.091]);
  for (let k = 0; k < 18; k++) if (rnd() < 0.6) spots.push([Math.cos(k * TAU / 18) * 0.137, Math.sin(k * TAU / 18) * 0.137]);
  spots.forEach(([x, z], i) => addStack(x, z - 0.02, (R(14, 38) | 0) - (Math.hypot(x, z) > 0.06 ? 7 : 0) - (Math.hypot(x, z) > 0.11 ? 7 : 0), i % chipDefs.length, 0.18));
  for (let i = 0; i < 16; i++) {
    const a = R(0, TAU), d = R(0.18, 0.3), tilt = rnd() < 0.35;
    const n = rnd() < 0.3 ? 2 + (rnd() * 3 | 0) : 1;
    for (let j = 0; j < n; j++)
      addChip(rnd() * chipDefs.length | 0, Math.cos(a) * d + j * R(-0.006, 0.006), TABLE_Y + CHIP.t * (j + 0.5) + (tilt ? 0.006 : 0.0003),
        Math.sin(a) * d - 0.02 + j * R(-0.006, 0.006), tilt ? R(-0.25, 0.25) : 0, tilt ? R(-0.25, 0.25) : 0);
  }
}
// my stacks
[[0.215, 1.15, 1, 22], [0.261, 1.15, 2, 16], [0.238, 1.195, 0, 26], [0.284, 1.195, 4, 9], [0.192, 1.195, 3, 13], [0.307, 1.15, 6, 11]]
  .forEach(([x, z, c, n]) => addStack(x, z, n, c, 0.05));

/* ---------- cards ---------- */
const CW = 0.0756, CL = 0.1056, CT = 0.0008, NS = 24, TW = 640, TH = 894;
function cardShape(g, w, h) { rr(g, 4, 4, w - 8, h - 8, 40); }
const backTex = canvasTex(TW, TH, (g, w, h) => {
  cardShape(g, w, h); g.fillStyle = '#d9d3c6'; g.fill();
  const m = 34; rr(g, m, m, w - 2 * m, h - 2 * m, 22); g.fillStyle = '#4d0814'; g.fill();
  g.save(); g.clip();
  g.strokeStyle = 'rgba(224,186,112,.2)'; g.lineWidth = 1.5;
  for (let k = -h; k < w + h; k += 42) {
    g.beginPath(); g.moveTo(k, 0); g.lineTo(k + h, h); g.stroke();
    g.beginPath(); g.moveTo(k, h); g.lineTo(k + h, 0); g.stroke();
  }
  g.restore();
  g.strokeStyle = '#d9b56c'; g.lineWidth = 4; rr(g, m + 16, m + 16, w - 2 * m - 32, h - 2 * m - 32, 14); g.stroke();
  g.beginPath(); g.ellipse(w / 2, h / 2, 100, 132, 0, 0, TAU); g.fillStyle = '#3c050d'; g.fill(); g.lineWidth = 5; g.stroke();
  g.lineWidth = 2; g.beginPath(); g.ellipse(w / 2, h / 2, 88, 120, 0, 0, TAU); g.stroke();
  spade(g, w / 2, h / 2 - 4, 120); g.fillStyle = '#d9b56c'; g.fill();
  noise(g, w, h, 8);
});
function faceBase(g, w, h, rank) {
  cardShape(g, w, h); g.fillStyle = '#fbf8f0'; g.fill();
  g.lineWidth = 2; g.strokeStyle = 'rgba(0,0,0,.18)'; g.stroke();
  for (const rot of [0, Math.PI]) {
    g.save(); g.translate(w / 2, h / 2); g.rotate(rot); g.translate(-w / 2, -h / 2);
    g.fillStyle = '#111'; g.font = '700 92px Georgia, "Times New Roman", serif'; g.textAlign = 'center';
    g.fillText(rank, 70, 112); spade(g, 70, 170, 58); g.fill();
    g.restore();
  }
}
const aceTex = canvasTex(TW, TH, (g, w, h) => {
  faceBase(g, w, h, 'A');
  spade(g, w / 2, h / 2 - 6, 340); g.fillStyle = '#0c0c0c'; g.fill();
  spade(g, w / 2, h / 2 - 2, 292); g.strokeStyle = 'rgba(251,248,240,.9)'; g.lineWidth = 3; g.stroke();
  spade(g, w / 2, h / 2 + 2, 250); g.lineWidth = 1.5; g.stroke();
  g.fillStyle = '#fbf8f0'; g.beginPath(); g.ellipse(w / 2, h / 2 - 10, 34, 46, 0, 0, TAU); g.fill();
  spade(g, w / 2, h / 2 - 12, 40); g.fillStyle = '#0c0c0c'; g.fill();
  noise(g, w, h, 6);
});
const kingTex = canvasTex(TW, TH, (g, w, h) => {
  faceBase(g, w, h, 'K');
  const fx = 122, fy = 150, fw = w - 2 * fx, fh = h - 2 * fy, cx = w / 2, mid = h / 2;
  g.save(); g.beginPath(); g.rect(fx, fy, fw, fh); g.clip();
  const half = () => {
    g.fillStyle = '#f4e8cb'; g.fillRect(fx, fy, fw, fh / 2);
    // sword behind
    g.fillStyle = '#c7ccd4'; g.strokeStyle = '#222'; g.lineWidth = 2.5;
    g.beginPath(); g.moveTo(cx - 108, fy + 8); g.lineTo(cx - 96, fy + 8); g.lineTo(cx - 92, mid - 40); g.lineTo(cx - 112, mid - 40); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#d9a63a'; g.fillRect(cx - 132, mid - 46, 60, 12); g.strokeRect(cx - 132, mid - 46, 60, 12);
    // robe
    g.fillStyle = '#b4202b'; g.beginPath();
    g.moveTo(fx, mid); g.lineTo(fx + 20, fy + 230); g.quadraticCurveTo(cx - 90, fy + 182, cx - 40, fy + 186);
    g.lineTo(cx + 40, fy + 186); g.quadraticCurveTo(cx + 90, fy + 182, fx + fw - 20, fy + 230); g.lineTo(fx + fw, mid); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#1f3c8c'; g.beginPath(); g.moveTo(cx - 60, fy + 190); g.lineTo(cx, mid - 6); g.lineTo(cx + 60, fy + 190); g.lineTo(cx + 34, fy + 186); g.lineTo(cx, fy + 240); g.lineTo(cx - 34, fy + 186); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#d9a63a';
    for (let i = 0; i < 9; i++) for (let j = 0; j < 3; j++) {
      const x = fx + 30 + i * 36, y = fy + 232 + j * 22 + (i % 2) * 11;
      if (Math.abs(x - cx) < 70) continue;

  if (p.dealer && p.dg === 'shuffle') leanT += 0.04;
  p.lean += (leanT - p.lean) * (1 - Math.exp(-dt * 1.4));
  p.torso.rotation.set(p.lean, 0.05 * Math.sin(T * 0.23 + p.ph * 2), 0.02 * Math.sin(T * 0.19 + p.ph));
  p.torso.updateMatrixWorld(true);

  if (p.dealer) {
    if (T > p.dt0 + p.ddur) {
      p.dg = p.dg === 'shuffle' ? (Math.random() < 0.5 ? 'idle' : 'tap') : (Math.random() < 0.6 ? 'shuffle' : 'idle');
      p.dt0 = T; p.ddur = p.dg === 'shuffle' ? R(3, 5) : R(2.5, 5);
    }
  } else for (const h of p.hands) if (T > h.t0 + h.dur) pickGesture(p, h, T);

  p.cardLiftT = 0; if (p.glass) p.glassAttached = false;
  const kf = 1 - Math.exp(-dt * 3);
  for (const h of p.hands) {
    handLocal(p, h, T);
    _W.copy(h.base); p.group.localToWorld(_W);
    h.cur.lerp(_W, 1 - Math.exp(-dt * h.k));
    _W.copy(h.micro).applyQuaternion(p.group.quaternion).add(h.cur);
    p.torso.localToWorld(_S.set(h.s * 0.19, 0.5, 0.0));
    if (h.poleMode === 'front') _pl.copy(p.Z).add(_t.set(0, -0.75, 0)).addScaledVector(p.X, h.s * 0.35);
    else _pl.copy(p.X).multiplyScalar(h.s * 0.9).add(DOWN).addScaledVector(p.Z, -0.35);
    h.pole.lerp(_pl.normalize(), kf);
    solveIK(_S, _W, UA, FA, h.pole, _E);
    _hd.subVectors(_W, _E).normalize(); const wrist = _W.copy(_E).addScaledVector(_hd, FA);
    placeSeg(h.upper, _S, _E); placeSeg(h.fore, _E, wrist);
    h.sh.position.copy(_S); h.el.position.copy(_E);
    // hand: lies flat on the felt, follows the forearm when raised
    const raise = THREE.MathUtils.clamp((wrist.y - 0.86) / 0.18, 0, 1);
    const fd = _t.copy(_hd); _hd.y = THREE.MathUtils.lerp(fd.y * 0.12 - 0.05, fd.y, raise); _hd.normalize();
    h.hand.position.copy(wrist); h.hand.lookAt(_d.copy(wrist).add(_hd));
    if (h.cuff) { placeSeg(h.cuff, _d.copy(wrist).addScaledVector(fd.copy(_E).sub(wrist).normalize(), 0.024), wrist); }
    if (p.glass && p.glassSide === h.s && p.glassAttached) {
      p.glass.position.copy(wrist).addScaledVector(_hd, 0.05); p.glass.position.y -= 0.075;
    }
    h.wrist = h.wrist || new V3(); h.wrist.copy(wrist);
  }
  if (p.glass && !p.glassAttached) p.glass.position.lerp(p.glassRest, 1 - Math.exp(-dt * 8));
  if (p.deck) {
    if (p.dg === 'shuffle') {
      _t.addVectors(p.hands[0].wrist, p.hands[1].wrist).multiplyScalar(0.5).addScaledVector(p.Z, 0.06); _t.y -= 0.012;
      p.deck.position.lerp(_t, 1 - Math.exp(-dt * 10));
      p.deck.rotation.set(0, 0, 0); p.deck.quaternion.copy(p.group.quaternion); p.deck.rotateX(-0.12 + 0.05 * Math.sin(T * 7));
    } else { p.deck.position.lerp(p.deckRest, 1 - Math.exp(-dt * 5)); p.deck.quaternion.slerp(p.group.quaternion, 1 - Math.exp(-dt * 5)); }
  }
  p.cardLift += (p.cardLiftT - p.cardLift) * (1 - Math.exp(-dt * 5));
  p.cardPivots.forEach((c, i) => c.rotation.x = p.cardLift * (i ? 0.85 : 1));
}

/* ---------- dust in the light ---------- */
const dust = (() => {
  const n = 260, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const a = R(0, TAU), d = Math.sqrt(rnd()) * 1.3; pos.set([Math.cos(a) * d, R(0.85, 1.6), Math.sin(a) * d], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({ map: bokehTex, size: 0.006, color: 0xffe2b8, transparent: true, opacity: 0.35, depthWrite: false, blending: THREE.AdditiveBlending });
  const pts = new THREE.Points(g, m); scene.add(pts); return pts;
})();

/* ---------- interaction ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hint = document.getElementById('hint');
let drag = null, hover = null, hinted = false, pointer = { x: 0, y: 0 };
function pick(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects([...myCards.map(c => c.mesh), pad], false);
  if (!hits.length) return null;
  const c = myCards.find(c => c.mesh === hits[0].object);
  return c || (hits[0].point.x < 0 ? myCards[0] : myCards[1]);
}
function setLift(card, v) {
  card.target = THREE.MathUtils.clamp(v, 0, MAX_LIFT);
  const other = myCards[1 - myCards.indexOf(card)];
  other.target = card.target * 0.9;
  if (!hinted && card.target > 0.6) { hinted = true; setTimeout(() => hint.classList.add('hide'), 1800); }
}
canvas.addEventListener('pointerdown', e => {
  const c = pick(e); if (!c) return;
  drag = { card: c, y0: e.clientY, a0: c.target, id: e.pointerId };
  canvas.setPointerCapture(e.pointerId); canvas.style.cursor = 'grabbing'; e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  pointer.x = e.clientX / innerWidth * 2 - 1; pointer.y = e.clientY / innerHeight * 2 - 1;
  if (drag) { setLift(drag.card, drag.a0 + (drag.y0 - e.clientY) / (innerHeight * 0.26) * MAX_LIFT); return; }
  if (e.pointerType === 'mouse') { hover = pick(e); canvas.style.cursor = hover ? 'grab' : 'default'; }
});
const endDrag = e => {
  if (!drag) return;
  for (const c of myCards) if (c.target < 0.07) c.target = 0;
  drag = null; canvas.style.cursor = hover ? 'grab' : 'default';
};
canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('pointerleave', () => { if (!drag) hover = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); setLift(myCards[0], myCards[0].target + (e.key === 'ArrowUp' ? 0.22 : -0.22));
  }
});

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let look = { x: 0, y: 0 };
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), T = clock.elapsedTime;
  for (const p of players) updatePlayer(p, T, dt);

  for (const c of myCards) {
    const tgt = Math.max(c.target, hover && !drag ? 0.045 : 0);
    const k = 110, damp = 2 * Math.sqrt(k) * 0.62;
    c.vel += ((tgt - c.ang) * k - c.vel * damp) * dt; c.ang += c.vel * dt;
    if (c.ang < 0) { c.ang = 0; c.vel = -c.vel * 0.28; }
    const bt = 0.32 * Math.min(1, c.ang / 0.55) + THREE.MathUtils.clamp(c.vel * 0.03, -0.08, 0.12);
    c.bend += (bt - c.bend) * (1 - Math.exp(-dt * 10));
    bendCard(c);
  }

  for (const s of scene.userData.bokeh) s.material.opacity = s.userData.o * (0.75 + 0.25 * Math.sin(T * s.userData.sp + s.userData.ph));
  dust.rotation.y = T * 0.015; dust.position.y = Math.sin(T * 0.2) * 0.02;

  const amp = reduceMotion ? 0 : 1;
  const lx = drag ? 0 : pointer.x, ly = drag ? 0 : Math.max(0, pointer.y);
  look.x += (lx - look.x) * (1 - Math.exp(-dt * 2)); look.y += (ly - look.y) * (1 - Math.exp(-dt * 2));
  camera.position.set(CAM.x + 0.006 * Math.sin(T * 0.4) * amp, CAM.y + 0.004 * Math.sin(T * 1.5) * amp, CAM.z);
  camera.rotation.y = (-look.x * 0.045 + 0.008 * Math.sin(T * 0.21)) * amp;
  camera.rotation.x = -basePitch - look.y * 0.025 * amp;
  renderer.render(scene, camera);
});
</script>
</body>
