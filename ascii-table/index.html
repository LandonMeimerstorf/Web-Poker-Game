<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Poker Table</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: asset bench, calm and exact
   IDEA: a camera locked off on the felt in a roaring Vegas slot floor, your hole cards in front, the pot beyond
   PICTURE: five graduated chip stacks rising like a mountain at the table's centre
   COLOUR and TYPE: near-black, olive felt glyphs, chip colours; JetBrains Mono
   LAYOUT: render fills the screen, one control strip at the bottom */
:root{color-scheme:dark;--ink:#e9e3d6;--dim:#8d877b;--line:rgba(255,255,255,.09);--acc:#ff3b3b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:#0a0a0a;color:var(--ink);overflow:hidden;font:500 13px/1.3 "JetBrains Mono",ui-monospace,monospace}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hint{position:fixed;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 108px);transform:translateX(-50%);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(14,14,14,.7);color:var(--ink);white-space:nowrap;pointer-events:none;transition:opacity 1.2s}
#hint.hide{opacity:0}
.tag{position:fixed;top:16px;left:18px;color:var(--dim);letter-spacing:.02em;pointer-events:none}
.tag b{color:var(--ink);font-weight:700}
.bar{position:fixed;right:14px;top:10px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;
  width:max-content;max-width:calc(100% - 20px);padding:6px;border:1px solid var(--line);border-radius:14px;background:rgba(14,14,14,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:2px;border-radius:10px;background:rgba(255,255,255,.04)}
button{font:inherit;color:var(--dim);background:none;border:0;border-radius:8px;min-height:40px;padding:0 12px;cursor:pointer}
button:hover{color:var(--ink)}
button[aria-pressed=true]{color:var(--ink);background:rgba(255,255,255,.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.go{color:#0a0a0a;background:var(--ink);font-weight:700}
.go:hover{color:#0a0a0a;background:#fff}
label{display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--dim);min-height:40px}
input[type=range]{width:110px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-8px);opacity:0;transition:.25s;padding:8px 14px;border-radius:999px;background:var(--ink);color:#0a0a0a;font-weight:700;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
.err{position:fixed;inset:0;display:none;place-items:center;color:var(--dim);font:16px system-ui,sans-serif;text-align:center;padding:24px}
/* pot label: floats over the pot */
#pot{position:fixed;left:0;top:0;pointer-events:none;text-align:center;padding:6px 12px 7px;border-radius:10px;border:1px solid rgba(255,210,63,.35);
  background:rgba(8,6,4,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap}
#pot::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;transform:translateX(-50%) rotate(45deg);background:rgba(8,6,4,.72);border-right:1px solid rgba(255,210,63,.35);border-bottom:1px solid rgba(255,210,63,.35)}
#pot small{display:block;color:var(--dim);font-size:11px;letter-spacing:.08em}
#potAmt{display:block;color:#ffd23f;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
/* bet panel: bottom middle, the stack on the felt follows it */
.betp{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(560px,calc(100% - 24px));
  padding:10px 16px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(10,8,6,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.betp .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:4px}
.betp .lbl{color:var(--dim)}
#betAmt{font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
#betBreak{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:flex-end;color:var(--dim);font-size:12px}
#betBreak i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1.5px rgba(255,255,255,.5) inset}
.rng{display:flex;align-items:center;gap:12px}
.rng span{color:var(--dim);font-variant-numeric:tabular-nums;min-width:3ch}
#bet{flex:1;-webkit-appearance:none;appearance:none;height:44px;background:transparent;margin:0;width:100%;accent-color:#d81e2a}
#bet::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#d81e2a var(--fill,0%),rgba(255,255,255,.12) var(--fill,0%))}
#bet::-moz-range-track{height:8px;border-radius:99px;background:linear-gradient(90deg,#d81e2a var(--fill,0%),rgba(255,255,255,.12) var(--fill,0%))}
#bet::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;cursor:grab;border:0;
  background:radial-gradient(circle,#f3e6d6 0 26%,#d81e2a 27% 52%,transparent 53%),repeating-conic-gradient(#f4efe4 0 14deg,#d81e2a 14deg 45deg);box-shadow:0 2px 8px rgba(0,0,0,.6)}
#bet::-moz-range-thumb{width:30px;height:30px;border-radius:50%;cursor:grab;border:0;
  background:radial-gradient(circle,#f3e6d6 0 26%,#d81e2a 27% 52%,transparent 53%),repeating-conic-gradient(#f4efe4 0 14deg,#d81e2a 14deg 45deg);box-shadow:0 2px 8px rgba(0,0,0,.6)}
#bet:focus-visible{outline:none}#bet:focus-visible::-webkit-slider-thumb{outline:2px solid #ffd23f;outline-offset:2px}
@media (max-width:600px){.tag{display:none}#betAmt{font-size:19px}input[type=range]{width:84px}button{padding:0 9px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div class="tag"><b>The table</b> &middot; 35mm, on the felt, on the floor</div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="hint">Press on your cards and drag up to peel the corner, let go to drop them</div>
<div class="err" id="err">Couldn't load the renderer. Reload to try again.</div>
<div id="pot" aria-live="polite"><small>POT</small><span id="potAmt">$0</span><small id="potChips"></small></div>
<div class="betp">
  <div class="top"><div><span class="lbl">Bet </span><span id="betAmt">$0</span></div><div id="betBreak"></div></div>
  <div class="rng"><span>$0</span><input id="bet" type="range" min="0" max="500" step="1" value="250" aria-label="Bet size"><span>$500</span></div>
</div>
<div class="bar">
  <div class="seg" role="group" aria-label="Palette">
    <button data-pal="0" aria-pressed="true">Color</button>
    <button data-pal="1" aria-pressed="false">Felt</button>
    <button data-pal="2" aria-pressed="false">Mono</button>
  </div>
  <label for="detail">Detail <input id="detail" type="range" min="1" max="10" step="1" value="7"></label>
  <button id="sound" aria-pressed="false">Sound</button>
  <button id="copy" class="go">Copy ASCII</button>
</div>

<script type="module">
{
let THREE, EffectComposer, RenderPass, ShaderPass, UnrealBloomPass, OutputPass, RoomEnvironment;
try {
  THREE = await import('three');
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  ({ RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js'));
} catch (e) { document.getElementById('err').style.display = 'grid'; throw e; }

const TAU = Math.PI * 2, V3 = THREE.Vector3;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const dpr = Math.min(devicePixelRatio, 2);
const state = { detail: 7, pal: 0 };
let seed = 21;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R = (a, b) => a + rnd() * (b - a);

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(dpr);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
canvas.setAttribute('aria-label', 'ASCII render from a 35mm lens resting on an olive felt poker table: two cards face down in front, five stacks of chips in the middle. Press and drag up on the cards, or hold the up arrow, to peel back their corner; let go and they drop flat.');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(90, 1, 0.03, 200);

/* ---------- chip artwork (same designs as the chip assets) ---------- */
const CHIPS = [
  { name: 'White', body: '#ece7da', spot: '#1f3fa0', inlay: '#c9d8f4', num: '#14286e', val: '1' },
  { name: 'Red',   body: '#d81e2a', spot: '#f4efe4', inlay: '#f3e6d6', num: '#b3111c', val: '5' },
  { name: 'Green', body: '#14a557', spot: '#f4efe4', inlay: '#e3efe2', num: '#0b6e37', val: '25' },
  { name: 'Black', body: '#303030', spot: '#f4efe4', inlay: '#e6e1d6', num: '#121212', val: '100' },
];
const SPOTS = 8, SPOT_W = 0.27;                   // spot angular width in radians
const spotAngle = k => (k + 0.5) * TAU / SPOTS;   // symmetric set, so face and rim line up
const FS = 1024;
function mk(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function sector(g, r0, r1, a, w) { g.beginPath(); g.arc(0, 0, r1, a - w / 2, a + w / 2); g.arc(0, 0, r0, a + w / 2, a - w / 2, true); g.closePath(); }
function spadeAt(g, cx, cy, s) {
  const P = (x, y) => [cx + x * s, cy + y * s];
  g.beginPath(); g.moveTo(...P(0, -0.5));
  g.bezierCurveTo(...P(0.16, -0.27), ...P(0.5, -0.12), ...P(0.5, 0.1));
  g.bezierCurveTo(...P(0.5, 0.31), ...P(0.24, 0.38), ...P(0.05, 0.21));
  g.bezierCurveTo(...P(0.07, 0.36), ...P(0.13, 0.45), ...P(0.22, 0.5));
  g.lineTo(...P(-0.22, 0.5));
  g.bezierCurveTo(...P(-0.13, 0.45), ...P(-0.07, 0.36), ...P(-0.05, 0.21));
  g.bezierCurveTo(...P(-0.24, 0.38), ...P(-0.5, 0.31), ...P(-0.5, 0.1));
  g.bezierCurveTo(...P(-0.5, -0.12), ...P(-0.16, -0.27), ...P(0, -0.5));
  g.closePath();
}
function drawFace(g, cd, mirror) {
  const R = FS / 2;
  g.fillStyle = cd.body; g.fillRect(0, 0, FS, FS);
  g.save(); g.translate(R, R); if (mirror) g.scale(-1, 1);
  g.fillStyle = cd.spot;
  for (let k = 0; k < SPOTS; k++) sector(g, R * 0.79, R * 1.02, spotAngle(k), SPOT_W), g.fill();
  // molded ticks between the spots and the inlay
  for (let k = 0; k < 16; k++) { g.save(); g.rotate(k * TAU / 16); g.fillRect(-12, -R * 0.755, 24, R * 0.08); g.restore(); }
  g.lineWidth = 10; g.strokeStyle = cd.spot; g.beginPath(); g.arc(0, 0, R * 0.6, 0, TAU); g.stroke();
  // inlay label
  g.fillStyle = cd.inlay; g.beginPath(); g.arc(0, 0, R * 0.53, 0, TAU); g.fill();
  g.lineWidth = 6; g.strokeStyle = cd.num; g.beginPath(); g.arc(0, 0, R * 0.47, 0, TAU); g.stroke();
  g.fillStyle = cd.num; g.textAlign = 'center'; g.textBaseline = 'middle';
  const fs = cd.val.length > 2 ? 210 : cd.val.length > 1 ? 260 : 300;
  g.font = `900 ${fs}px "Arial Black", "Helvetica Neue", Arial, sans-serif`;
  g.fillText(cd.val, 0, 22);
  spadeAt(g, 0, -R * 0.36, 50); g.fill();
  g.restore();
}
function drawEdge(g, w, h, cd) {
  g.fillStyle = cd.body; g.fillRect(0, 0, w, h);
  g.fillStyle = cd.spot;
  for (let k = 0; k < SPOTS; k++) { const u = spotAngle(k) / TAU, uw = SPOT_W / TAU; g.fillRect((u - uw / 2) * w, 0, uw * w, h); }
  g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(0, 0, w, h * 0.12); g.fillRect(0, h * 0.88, w, h * 0.12);   // rounded-edge shading
}
const chipMats = CHIPS.map(cd => {
  const base = { color: 0xd4d4d4, roughness: 0.55, clearcoat: 0.2, clearcoatRoughness: 0.45, envMapIntensity: 0.35, specularIntensity: 0.5 };
  const side = new THREE.MeshPhysicalMaterial({ ...base, map: mk(1024, 64, (g, w, h) => drawEdge(g, w, h, cd)) });
  const top = new THREE.MeshPhysicalMaterial({ ...base, map: mk(FS, FS, g => drawFace(g, cd, false)) });
  const bot = new THREE.MeshPhysicalMaterial({ ...base, map: mk(FS, FS, g => drawFace(g, cd, true)) });
  return [side, top, bot];
});

/* ---------- table: olive felt top, padded rail, pedestal ---------- */
const TR = 3.0;
const feltTex = mk(1024, 1024, (g, w, h) => {
  g.fillStyle = '#2b4a21'; g.fillRect(0, 0, w, h);
  const id = g.getImageData(0, 0, w, h), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 12; d[i] += n * 0.8; d[i + 1] += n; d[i + 2] += n * 0.5; }
  g.putImageData(id, 0, 0);
  const rg = g.createRadialGradient(w / 2, h / 2, w * 0.05, w / 2, h / 2, w / 2);
  rg.addColorStop(0, 'rgba(90,110,40,.12)'); rg.addColorStop(0.65, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.35)');
  g.fillStyle = rg; g.fillRect(0, 0, w, h);
});
const felt = new THREE.Mesh(new THREE.CircleGeometry(TR, 160), new THREE.MeshStandardMaterial({ map: feltTex, emissiveMap: feltTex, emissive: 0xffffff, emissiveIntensity: 0.32, roughness: 1, envMapIntensity: 0.1 }));
felt.rotation.x = -Math.PI / 2; felt.receiveShadow = true; scene.add(felt);
const dark = new THREE.MeshStandardMaterial({ color: 0x17110d, roughness: 0.55, envMapIntensity: 0.4 });
const rail = new THREE.Mesh(new THREE.TorusGeometry(TR + 0.12, 0.17, 32, 200), dark);
rail.rotation.x = -Math.PI / 2; rail.position.y = 0.05; rail.castShadow = rail.receiveShadow = true; scene.add(rail);
const apron = new THREE.Mesh(new THREE.CylinderGeometry(TR + 0.22, TR - 0.1, 0.4, 160, 1, true), dark);
apron.position.y = -0.26; scene.add(apron);
const under = new THREE.Mesh(new THREE.CircleGeometry(TR - 0.1, 96), dark); under.rotation.x = Math.PI / 2; under.position.y = -0.46; scene.add(under);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.8, 2.2, 64), dark); post.position.y = -1.56; scene.add(post);
const foot = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.6, 0.16, 96), dark); foot.position.y = -2.72; scene.add(foot);

/* ---------- the pot: five neat stacks, graduated small to tall, in one tight cluster ---------- */
const CR = 0.08, CT = 0.016;            // chip radius / thickness in table units (close to real scale; a 35mm frames them tightly)
const chipGeo = new THREE.CylinderGeometry(1, 1, 0.2, 48).scale(CR, CT / 0.2, CR);
const lists = CHIPS.map(() => []);
const Y = new V3(0, 1, 0), qa = new THREE.Quaternion(), ONE = new V3(1, 1, 1);
function put(ci, x, y, z, spin = R(0, TAU)) {
  qa.setFromAxisAngle(Y, spin);
  lists[ci].push(new THREE.Matrix4().compose(new V3(x, y, z), qa.clone(), ONE));
}
const S = CR / 0.11;                    // cluster layout is drawn for 0.11 chips, scaled to the real size
const STACKS = [
  // tallest, at the back: banded colours, drifting into a slight lean
  { x: 0.0, z: -0.12, n: 42, color: i => [1, 3, 2, 1, 0, 3][Math.floor(i / 7) % 6], dx: 0.0011, dz: -0.0004 },
  // black, each chip turned a little more than the last so the edge spots spiral up
  { x: 0.25, z: -0.04, n: 30, color: () => 3, twist: 0.13 },
  // green with the odd red mixed in
  { x: -0.24, z: 0.02, n: 21, color: i => (i % 7 === 4 ? 1 : 2) },
  // red, top two chips set down sloppy
  { x: 0.125, z: 0.175, n: 12, color: () => 1, top: [[0.018, 0.012], [0.03, -0.004]] },
  // white, just a few, top chip slid off-centre
  { x: -0.115, z: 0.225, n: 5, color: () => 0, top: [[0.045, 0.01]] },
];
for (const st of STACKS) {
  const x0 = st.x * S, z0 = st.z * S, base = R(0, TAU);
  for (let i = 0; i < st.n; i++) {
    let x = x0 + (st.dx || 0) * i + R(-1, 1) * 0.0025, z = z0 + (st.dz || 0) * i + R(-1, 1) * 0.0025;
    const fromTop = st.n - 1 - i;
    if (st.top && fromTop < st.top.length) { x += st.top[fromTop][0]; z += st.top[fromTop][1]; }
    put(st.color(i), x, CT * (i + 0.5), z, st.twist ? base + i * st.twist : R(0, TAU));
  }
}
/* ---------- your hole cards: the card assets, face down in front of the lens ---------- */
const TW = 640, TH = 896;
function tex(draw) {
  const c = document.createElement('canvas'); c.width = TW; c.height = TH;
  const g = c.getContext('2d'); draw(g, TW, TH);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function spade(g, cx, cy, s) {
  const P = (x, y) => [cx + x * s, cy + y * s];
  g.beginPath(); g.moveTo(...P(0, -0.5));
  g.bezierCurveTo(...P(0.16, -0.27), ...P(0.5, -0.12), ...P(0.5, 0.1));
  g.bezierCurveTo(...P(0.5, 0.31), ...P(0.24, 0.38), ...P(0.05, 0.21));
  g.bezierCurveTo(...P(0.07, 0.36), ...P(0.13, 0.45), ...P(0.22, 0.5));
  g.lineTo(...P(-0.22, 0.5));
  g.bezierCurveTo(...P(-0.13, 0.45), ...P(-0.07, 0.36), ...P(-0.05, 0.21));
  g.bezierCurveTo(...P(-0.24, 0.38), ...P(-0.5, 0.31), ...P(-0.5, 0.1));
  g.bezierCurveTo(...P(-0.5, -0.12), ...P(-0.16, -0.27), ...P(0, -0.5));
  g.closePath();
}
function face(g, w, h, rank) {
  g.fillStyle = '#f6f2e8'; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#b9b2a3'; g.lineWidth = 6; g.strokeRect(30, 30, w - 60, h - 60);
  for (const rot of [0, Math.PI]) {
    g.save(); g.translate(w / 2, h / 2); g.rotate(rot); g.translate(-w / 2, -h / 2);
    g.fillStyle = '#0c0c0c'; g.font = '700 150px Georgia, "Times New Roman", serif'; g.textAlign = 'center';
    g.fillText(rank, 100, 172); spade(g, 100, 262, 96); g.fill();
    g.restore();
  }
}
const aceTex = tex((g, w, h) => { face(g, w, h, 'A'); spade(g, w / 2, h / 2 - 8, 400); g.fillStyle = '#0c0c0c'; g.fill(); });
const kingTex = tex((g, w, h) => {
  face(g, w, h, 'K');
  const fx = 178, fy = 196, fw = w - 2 * fx, fh = h - 2 * fy, cx = w / 2, mid = h / 2;
  g.save(); g.beginPath(); g.rect(fx, fy, fw, fh); g.clip();
  const half = () => {
    g.fillStyle = '#efe2bf'; g.fillRect(fx, fy, fw, fh / 2);
    g.lineWidth = 5; g.strokeStyle = '#151515';
    g.fillStyle = '#c9ced6'; g.fillRect(fx + 24, fy + 6, 22, 200); g.strokeRect(fx + 24, fy + 6, 22, 200);         // sword
    g.fillStyle = '#d9a12c'; g.fillRect(fx + 6, fy + 196, 58, 18);
    g.fillStyle = '#c4141f'; g.beginPath();                                                                      // robe
    g.moveTo(fx, mid); g.lineTo(fx, fy + 232); g.quadraticCurveTo(cx - 70, fy + 188, cx, fy + 190);
    g.quadraticCurveTo(cx + 70, fy + 188, fx + fw, fy + 232); g.lineTo(fx + fw, mid); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#1f3fa0'; g.beginPath(); g.moveTo(cx - 58, fy + 196); g.lineTo(cx, mid); g.lineTo(cx + 58, fy + 196); g.closePath(); g.fill(); g.stroke();
    g.fillStyle = '#d9a12c'; for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(cx, fy + 214 + i * 12, 4, 0, TAU); g.fill(); }

// 35mm on a full-frame (36 mm wide) sensor: about 54 degrees across on a wide screen
const FOCAL = 35;
const lensFov = () => 2 * THREE.MathUtils.radToDeg(Math.atan((36 / Math.max(camera.aspect, 1)) / 2 / FOCAL));
const LENS_R = 2.82, LENS_H = 0.15;     // camera body resting on the felt, just inside the rail, level
camera.position.set(Math.sin(VIEW_YAW) * LENS_R, LENS_H, Math.cos(VIEW_YAW) * LENS_R);
camera.lookAt(0, LENS_H, 0);
// key light sits between the lens and the stacks, so it lights their faces without blowing out the felt under the camera
keyL.position.set(camera.position.x, 0, camera.position.z).setLength(1.7); keyL.position.y = 1.5;
// a soft light just behind the lens, low, so the undersides of your cards read when you peel them
const peekL = new THREE.PointLight(0xfff1dc, 10, 2.6, 2);
peekL.position.set(camera.position.x, 0, camera.position.z).setLength(3.05); peekL.position.y = 0.38; scene.add(peekL);
function fitLens() { camera.fov = lensFov(); camera.updateProjectionMatrix(); }
addEventListener('resize', fitLens); fitLens();
const clock = new THREE.Clock();
const soundBtn = document.getElementById('sound');
soundBtn.addEventListener('click', () => {
  audio.on = !audio.on; soundBtn.setAttribute('aria-pressed', String(audio.on));
  try { if (audio.on) audio.start(); else audio.ctx && audio.ctx.suspend(); } catch (e) { audio.on = false; soundBtn.setAttribute('aria-pressed', 'false'); say('Sound is not available here'); }
});
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  updatePeel(dt); updateCasino(clock.elapsedTime, dt); updateBetChips(dt); placePot();
  ascii.uniforms.time.value = clock.elapsedTime;
  composer.render();
});
canvas.dataset.chips = chipCount;
}
</script>
